# Dependabot dependency updates for himmel (HIMMEL-500).
# One npm entry per package manifest (npm ecosystem also covers bun.lock).
# github-actions is included for when CI workflows land (HIMMEL-494) — it is a
# no-op until .github/workflows/ exists.
#
# Who bumps what (HIMMEL-4258) — one owner per pin, never two:
#   Dependabot     npm manifests (above) and every workflow `uses:` (github-actions).
#                  The CI image's base digest (docker, .github/ci-image/Dockerfile).
#   drift loop     scripts/upstreams.json `version_pin` entries (the nightly
#                  /drift-fix bump): .bun-version (bun-ci), graphify, ast-grep, ...
#   pin-scan.py    reports (a chore(deps) PR bumps): pre-commit revs (Dependabot's
#                  pre-commit ecosystem would ignore pin-holds.json), the gitleaks
#                  ver= + sha, OXLINT_VERSION=.
#   Dependabot     also the hashed pip requirements in .github/ci-image (pip entry).
# Every ecosystem carries cooldown.default-days: 3 (HIMMEL-7092): a release is not
# proposed until it has been public for 3 days, so a hijacked release that is pulled
# within hours never reaches a PR. Dependabot security updates ignore the cooldown.
# Not watched here on purpose: bun (.bun-version is a version file Dependabot's
# bun ecosystem does not read; bun.lock is covered by the npm entries) and the
# claude CLI lock (.github/claude-cli: bumped by hand together with CLAUDE_CLI_VERSION).
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/scripts/jira"
      - "/scripts/bitbucket"
      - "/scripts/himmel-run"
      - "/scripts/luna-vitals"
      - "/marketplace/plugins/luna-correlate"
      - "/marketplace/plugins/obsidian-triage/tools"
      - "/marketplace/plugins/telegram-himmel"
      - "/plugins/himmel-gh"
      - "/plugins/himmel-jira"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into one PR per directory to cut review churn;
      # majors still come as individual PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Digest bumps of the CI image's ubuntu:24.04 base only: a release jump
  # (24.10, 26.04) is a deliberate Dockerfile change, not a weekly bump.
  - package-ecosystem: "docker"
    directory: "/.github/ci-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The hashed requirements files the CI image and workflows use
  # (requirements-ci.txt, requirements-shellcheck.txt). Dependabot rewrites the
  # pins and their hashes together. A shellcheck-py bump must also move the
  # .pre-commit-config.yaml rev (check-ci-install-locks.sh fails until it does).
  - package-ecosystem: "pip"
    directory: "/.github/ci-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
