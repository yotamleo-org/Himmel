# A fixed uid ("prometheus") lets alert rules and imported dashboards
# reference this datasource without an operator manually binding a random uid.
apiVersion: 1

# Grafana resolves an existing datasource by name, then updates by uid.
# A leftover row with another uid makes provisioning fatal at startup.
# Deleting first is safe because this datasource is non-editable and fully
# provisioned; it is recreated with the same uid used by alert rules.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
