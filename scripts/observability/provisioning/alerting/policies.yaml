# Every himmel-observability rule uses the single Telegram contact point.
# Severity labels alone do not change notification frequency; the nested
# warn route gives standing warnings a longer repeat interval than pages.
apiVersion: 1

policies:
  - orgId: 1
    receiver: himmel-telegram
    group_by: ['alertname', 'flow', 'task', 'class', 'stage', 'job']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h  # HIMMEL-2130 (operator-directed, 2026-08-26): was 4h
    routes:
      # severity=warn alerts (HimmelAgentTreeRamRunaway,
      # HimmelSessionDead) still deliver to the same
      # Telegram contact point — dropping them entirely would remove the
      # ONLY notification surface this stack has (no Alertmanager, and this
      # IS the delivery path, unlike alerts.rules.yml's self-visibility-only
      # copy) — but repeat far less often, so a standing warn-level signal
      # stops re-pinging every 12h like a page does. 7d: long enough that a
      # persistent warn condition is not routine noise, short enough that a
      # week-old unresolved warn still resurfaces.
      - receiver: himmel-telegram
        matchers:
          - severity = warn
        group_by: ['alertname', 'flow', 'task', 'class', 'stage', 'job']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 168h
        continue: false
