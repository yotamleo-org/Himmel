# Grafana's native Telegram notifier needs no new
# bridge code; the notifier's outbound call is api.telegram.org sendMessage
# only (never getUpdates/webhook registration), so it cannot collide with
# the Telegram bridge's single poller — see README.md's "Alerting" section
# for the full evidence trail (this reuses the same bot token and chat_id
# resolution `luna-sync-alert.ts` already ships with).
#
# No secret is committed here. bottoken/chatid come from the Grafana
# process's OWN environment via Grafana's alerting file-provisioning
# variable interpolation ($NAME, plain, no braces — confirmed against the
# Grafana 13.1 docs; a different `$__env{}` syntax exists for datasource
# provisioning, not used here). No installer sets
# GRAFANA_TELEGRAM_BOT_TOKEN / GRAFANA_TELEGRAM_CHAT_ID: whoever enables this
# contact point exports both in the Grafana process's environment (a
# SEPARATE send-only bot token is the sanctioned choice; see
# docs/configuration.md).
#
# message is omitted deliberately: Grafana's built-in default template
# renders alertname/labels/annotations only — the same fixed-field set this
# whole alerting layer is built on (design §6.6) — never ledger `note` text
# (the exporter never turns `note` into a label or annotation value; see
# flow-exporter.ts).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: himmel-telegram
    receivers:
      - uid: himmel_telegram_receiver
        type: telegram
        settings:
          bottoken: $GRAFANA_TELEGRAM_BOT_TOKEN
          chatid: $GRAFANA_TELEGRAM_CHAT_ID
