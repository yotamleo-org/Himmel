# Dependabot dependency updates for himmel (HIMMEL-500).
# One npm entry per package manifest (npm ecosystem also covers bun.lock).
# github-actions is included for when CI workflows land (HIMMEL-494) — it is a
# no-op until .github/workflows/ exists.
#
# Who bumps what (HIMMEL-4258) — one owner per pin, never two:
#   Dependabot     npm manifests (above) and every workflow `uses:` (github-actions).
#                  The CI image's base digest (docker, .github/ci-image/Dockerfile).
#   drift loop     scripts/upstreams.json `version_pin` entries (the nightly
#                  /drift-fix bump): .bun-version (bun-ci), graphify, ast-grep, ...
#   pin-scan.py    reports (a chore(deps) PR bumps): pre-commit revs (Dependabot's
#                  pre-commit ecosystem would ignore pin-holds.json), the gitleaks
#                  ver= + sha, OXLINT_VERSION=.
#   Dependabot     also the hashed pip requirements in .github/ci-image (pip entry).
# Every ecosystem carries cooldown.default-days: 3 (HIMMEL-7092): a release is not
# proposed until it has been public for 3 days, so a hijacked release that is pulled
# within hours never reaches a PR. Dependabot security updates ignore the cooldown.
# Not watched here on purpose: bun (.bun-version is a version file Dependabot's
# bun ecosystem does not read; bun.lock is covered by the npm entries), the
# claude CLI lock (.github/claude-cli: bumped by hand together with CLAUDE_CLI_VERSION),
# the vendored marketplace/plugins/claude-hud (its VENDORED.md) and the benchmark
# fixtures under scripts/lanes/bench/fixtures. scripts/ci/check-manifest-coverage.sh
# fails on any other tracked manifest without an entry (HIMMEL-7173).
#
# Release-age buffer (HIMMEL-7173): beside the 3-day cooldown, installs and
# lockfile refreshes refuse a release younger than 3 days: bunfig.toml
# minimumReleaseAge (bun), .npmrc min-release-age (npm), uv.toml exclude-newer
# (uv pip compile). CAVEAT: npm reads min-release-age from 11.10 on; CI runs node
# 22 (npm 10), which ignores it, so .npmrc protects local installs only. The CI-side
# guard is the per-PR check .github/workflows/lockfile-release-age.yml, which runs
# scripts/ci/check-lockfile-release-age.mjs on every lockfile entry a PR adds; a
# security fix younger than 3 days goes in scripts/ci/release-age-allow.txt.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/scripts/jira"
      - "/scripts/bitbucket"
      - "/scripts/himmel-run"
      - "/scripts/luna-vitals"
      - "/marketplace/plugins/luna-correlate"
      - "/marketplace/plugins/obsidian-triage/tools"
      - "/marketplace/plugins/telegram-himmel"
      - "/plugins/himmel-gh"
      - "/plugins/himmel-jira"
      - "/marketplace/plugins/himmel-bus"
      - "/scripts/ci-orchestrator"
      - "/scripts/config-ui/agui-web"
      - "/scripts/config-ui/tests/e2e"
      - "/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into one PR per directory to cut review churn;
      # majors still come as individual PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Digest bumps of the CI image's ubuntu:24.04 base only: a release jump
  # (24.10, 26.04) is a deliberate Dockerfile change, not a weekly bump.
  - package-ecosystem: "docker"
    directory: "/.github/ci-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The hashed requirements files the CI image and workflows use
  # (requirements-ci.txt, requirements-shellcheck.txt). Dependabot rewrites the
  # pins and their hashes together. A shellcheck-py bump must also move the
  # .pre-commit-config.yaml rev (check-ci-install-locks.sh fails until it does).
  - package-ecosystem: "pip"
    directory: "/.github/ci-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # The obsidian-triage tools' hashed requirements (requirements-scrapling.txt,
  # requirements-whisper.txt), installed outside CI by the operator's venv / `uv run`.
  - package-ecosystem: "pip"
    directory: "/marketplace/plugins/obsidian-triage/tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
