  fail-fast-lanes-and-trust-suites:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-lanes-and-trust-suites' || 'fail-fast-lanes-and-trust-suites (deferred)' }}
