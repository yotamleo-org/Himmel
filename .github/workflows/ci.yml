          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run cancel "$RUN_ID" || true

  fail-fast-unchecked-mktemp-range:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-unchecked-mktemp-range' || 'fail-fast-unchecked-mktemp-range (deferred)' }}
    needs: unchecked-mktemp-range
