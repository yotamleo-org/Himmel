  fail-fast-claude-startup:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-claude-startup' || 'fail-fast-claude-startup (deferred)' }}
