        run: |
          gh run cancel "$RUN_ID" || true

  fail-fast-commit-lint:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-commit-lint' || 'fail-fast-commit-lint (deferred)' }}
    needs: commit-lint
    if: failure() && needs.commit-lint.result == 'failure' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run cancel "$RUN_ID" || true

  fail-fast-plugin-version-bump:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-plugin-version-bump' || 'fail-fast-plugin-version-bump (deferred)' }}
    needs: plugin-version-bump
    if: failure() && needs.plugin-version-bump.result == 'failure' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel the run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run cancel "$RUN_ID" || true

  fail-fast-lint:
    name: ${{ (!(github.event_name == 'pull_request' && github.event.action == 'labeled') || (github.event.label.name == (vars.CI_GO_LABEL || 'ci:go') && vars.CI_GO_GATE == 'on')) && 'fail-fast-lint' || 'fail-fast-lint (deferred)' }}
