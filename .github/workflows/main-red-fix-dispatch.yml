name: Main Red Fix Dispatch

# Main has no push run (ci.yml runs main on a cron), so after a fix for a
# red main merges, the next proof is the next cron sweep, hours later, and the
# fleet waits on it. A merged PR that carries the `fixes-main-red` label, or a
# `Fixes-main-red:` line in its body, dispatches ci.yml on main at once.
#
# Trigger: a push to main, not a PR event. GitHub blocks pull_request_target in
# public repos without an event-policy exception, and a pull_request run for a
# merged fork PR gets a read-only token. A push run uses main's copy of this file
# with this repo's token, for every merged PR, fork or not.
on:
  push:
    branches: [main]
  # Manual: the same dispatch with no PR (`gh workflow run main-red-fix-dispatch.yml`).
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-main-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ci.yml on main when the merged PR fixes a red main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          PR_NUMBER=
          if [ "$EVENT" != workflow_dispatch ]; then
            pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$SHA\")] | first // empty")
            if [ -z "$pr" ]; then
              echo "Commit $SHA is no merged PR's merge commit; nothing to dispatch."
              exit 0
            fi
            PR_NUMBER=$(jq -r .number <<<"$pr")
            PR_LABELS=$(jq -r '[.labels[].name] | join(" ")' <<<"$pr")
            PR_BODY=$(jq -r '.body // ""' <<<"$pr")
            case " $PR_LABELS " in
              *" fixes-main-red "*) ;;
              *)
                if ! grep -qiE '^[[:space:]]*Fixes-main-red:' <<<"$PR_BODY"; then
                  echo "PR #$PR_NUMBER carries no fixes-main-red label or Fixes-main-red: line; nothing to dispatch."
                  exit 0
                fi ;;
            esac
          fi
          gh workflow run ci.yml --ref main
          echo "Dispatched ci.yml on main${PR_NUMBER:+ after PR #$PR_NUMBER merged}."
