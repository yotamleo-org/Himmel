name: snyk-weekly

# Weekly Snyk scan. Runs
# scripts/security/snyk-scan.sh (Open Source + Code) and uploads the raw JSON and
# summary as an artifact. Schedule and manual dispatch only, never per PR: the
# free plan caps the tests per month and Open Source counts one per manifest.
# With no SNYK_TOKEN repo secret the job skips with a notice instead of failing.
# The scan exits 1 on any High or Critical finding, so a red run means findings.
# The forks scan (snyk-scan.sh --forks) runs after it, even when the main scan is red, and writes
# <date>.forks.json and <date>.forks.summary.md beside the main report; exit 1 is a High or
# Critical finding, exit 2 a fork that failed or the quota. About 16 + 48 Open Source tests per
# run. The dispatch input missing_ref_probe replaces the forks with one at a missing ref, to prove
# exit 2 names the fork; it skips the main scan. The dispatch input report_only runs both scans
# in full, writes the findings to the job summary and exits 0; the schedule and a default
# dispatch still fail on findings.
on:
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday UTC (offset from ci.yml's 17 7 and fork-drift's 41 6)
  workflow_dispatch:
    inputs:
      missing_ref_probe:
        description: Scan one fork at a missing ref instead of the real scan, to prove exit 2 names the fork
        type: boolean
        default: false
      report_only:
        description: Run the full main and forks scans, write the findings to the job summary and exit 0
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snyk-weekly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate on the token
        id: gate
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice title=snyk-weekly skipped::SNYK_TOKEN is not set; the operator adds it with: gh secret set SNYK_TOKEN --repo ${{ github.repository }}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Snyk CLI
        if: steps.gate.outputs.enabled == 'true'
        # install-scripts-ok: the snyk postinstall downloads the native CLI binary
        run: npm install -g snyk@1.1308.2

      - name: Install uv and curl for the forks scan
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          pipx install uv==0.13.5

      - name: Run the Snyk scan
        if: steps.gate.outputs.enabled == 'true' && inputs.missing_ref_probe != true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          rc=0
          bash scripts/security/snyk-scan.sh --repo "$GITHUB_WORKSPACE" --out-dir "$RUNNER_TEMP/snyk" || rc=$?
          if [ "$REPORT_ONLY" = "true" ]; then
            cat "$RUNNER_TEMP"/snyk/*.summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "::notice title=report_only::main scan exit code $rc reported, not failed"
            exit 0
          fi
          exit "$rc"

      - name: Run the forks scan
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          MISSING_REF_PROBE: ${{ inputs.missing_ref_probe }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          if [ "$MISSING_REF_PROBE" = "true" ]; then
            export SNYK_SCAN_FORKS='claude-hud|https://github.com/jarrodwatts/claude-hud|0000000000000000000000000000000000000000|-'
          fi
          rc=0
          bash scripts/security/snyk-scan.sh --forks --out-dir "$RUNNER_TEMP/snyk" || rc=$?
          for f in "$RUNNER_TEMP"/snyk/*.forks.summary.md; do
            [ -f "$f" ] || continue
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            awk '/^## /{n=substr($0,4)} /^- status: error/{print "::error title=snyk fork scan failed::" n ": " substr($0,10)}' "$f"
          done
          if [ "$REPORT_ONLY" = "true" ]; then
            echo "::notice title=report_only::forks scan exit code $rc reported, not failed"
            exit 0
          fi
          exit "$rc"

      - name: Upload the scan result
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-scan
          path: ${{ runner.temp }}/snyk/
          if-no-files-found: error
          retention-days: 90
