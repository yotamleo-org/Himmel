name: config-ui e2e

on:
  pull_request:
    paths:
      - 'scripts/config-ui/**'
      - '.github/workflows/config-ui-e2e.yml'
      - '.bun-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-ui-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/config-ui/tests/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install pinned Playwright
        run: bun install --frozen-lockfile
      - name: Build AG-UI so its browser tests run
        working-directory: scripts/config-ui/agui-web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('scripts/config-ui/tests/e2e/bun.lock') }}
      # The cache holds browsers, not the runner's OS libraries: install deps even on a hit.
      - name: Provision Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser tests
        run: ./node_modules/.bin/playwright test
