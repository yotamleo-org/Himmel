name: Pages

# The Pages source is build_type=workflow. This workflow deploys once a day
# (17 03 UTC) and on demand via `gh workflow run pages.yml`; it does not deploy
# on push. Static suite: scripts/ci/test-pages-workflow.sh.
#
# docs/ is uploaded as-is. docs/.nojekyll turns Jekyll off, so no build step
# is needed.
#
# The workflow is deliberately NOT named `CI`: scripts/handover/console-kit/
# cut-tag.sh reads the commit's workflow run named exactly `CI`.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a RUNNING deploy (a half-published site); a newer queued run
  # replaces an older still-pending one.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
