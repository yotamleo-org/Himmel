name: Pages

# The Pages source is build_type=workflow. This workflow deploys once a day
# (17 03 UTC) and on demand via `gh workflow run pages.yml`; it does not deploy
# on push. Static suite: scripts/ci/test-pages-workflow.sh.
#
# The Starlight site in site/ is built from docs/ and site/dist is uploaded.
# docs/.nojekyll stays so a plain static serve of docs/ matches the raw files.
#
# Two jobs: `build` runs the npm code (npm ci --ignore-scripts, astro
# build) with a read-only token and no persisted git credentials; `deploy`
# holds the Pages write and OIDC permissions and runs no repo code.
#
# The workflow is deliberately NOT named `CI`: scripts/handover/chief-kit/
# cut-tag.sh reads the commit's workflow run named exactly `CI`.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a RUNNING deploy (a half-published site); a newer queued run
  # replaces an older still-pending one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the docs site
        working-directory: site
        run: |
          npm ci --ignore-scripts
          npm run build
      # The tests below read the built site/dist; any failing step stops the run before the upload.
      - name: Run the docs-site build test
        run: bash scripts/docs-site/test-site-build.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check the UI's docs links against the built routes
        run: bun test scripts/config-ui/tests/docs-routes.test.ts
      - name: Install the pinned Playwright and Chromium
        working-directory: scripts/config-ui/tests/e2e
        run: |
          bun install --frozen-lockfile --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
      # The J1 spec lives beside the docs site and borrows config-ui's pinned @playwright/test through NODE_PATH.
      - name: Run the J1 journey against astro preview
        working-directory: scripts/docs-site/e2e
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/config-ui/tests/e2e/node_modules
        run: ../../config-ui/tests/e2e/node_modules/.bin/playwright test -c j1.config.ts
      - name: Serve llms.txt at the site root
        run: |
          cp llms.txt site/dist/llms.txt
          test -s site/dist/llms.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - name: Note that this run will not deploy
        if: github.ref != 'refs/heads/main'
        run: echo "::notice title=Pages deploy skipped::ref ${GITHUB_REF_NAME} is not main, so this run builds only. Dispatch with --ref main to publish."

  deploy:
    needs: build
    # The github-pages environment allows only main: a branch run builds and skips the deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
