name: Pages

# The Pages source is build_type=workflow. This workflow deploys once a day
# (17 03 UTC) and on demand via `gh workflow run pages.yml`; it does not deploy
# on push. Static suite: scripts/ci/test-pages-workflow.sh.
#
# The Starlight site in site/ is built from docs/ and site/dist is uploaded.
# docs/.nojekyll stays so a plain static serve of docs/ matches the raw files.
#
# The workflow is deliberately NOT named `CI`: scripts/handover/console-kit/
# cut-tag.sh reads the commit's workflow run named exactly `CI`.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a RUNNING deploy (a half-published site); a newer queued run
  # replaces an older still-pending one.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the docs site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
