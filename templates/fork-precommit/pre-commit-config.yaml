# himmel fork-adapter pre-commit core (HIMMEL-5978).
# Copy to <fork>/.himmel/pre-commit-config.yaml next to gitleaks.toml, then:
#   pre-commit install -c .himmel/pre-commit-config.yaml -t pre-commit -t commit-msg
# It lives under .himmel/ so upstream never touches it and rebases stay clean;
# the fork's own .pre-commit-config.yaml (if any) is left alone, but a clone runs
# ONE config: append that file's repos: here, or its hooks stop running.
# Security and process only: no lint, no formatting. A fork's own linters win.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.himmel/gitleaks.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Per fork: set --branch to the fork's default branch (main, dev, v8, current).
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # commit-msg: conventional subject carrying a HIMMEL-<n> ticket; merge and
      # revert messages pass. --multiline matches the whole message, so \A pins
      # the check to the subject (a ticketed body line cannot satisfy it);
      # --negate fails when there is no match.
      - id: himmel-ticket-id
        name: conventional commit subject with a HIMMEL-<n> ticket ID
        language: pygrep
        entry: '\A((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)\n]+\))?!?: [^\n]*HIMMEL-[0-9]+|(Merge|Revert) )'
        args: [--negate, --multiline]
        always_run: true
        stages: [commit-msg]
