# gitleaks config for the luna second-brain vault.
# Keeps the full built-in ruleset and only adds a path allowlist for the
# vendored third-party Obsidian plugin bundles shipped under .obsidian/plugins/
# (and the opt-in github-sync plugin's generated assets
# under optional/plugins/github-sync/ instead). Those bundles are minified
# upstream code; gitleaks' generic-api-key rule flags high-entropy minified
# identifiers (e.g. node-forge's pki.setRsaPrivateKey in
# obsidian-local-rest-api) as false-positive "secrets". The pre-commit
# `exclude:` does NOT reach gitleaks (the hook scans the staged diff
# directly), so the allowlist has to live here. The github-sync allowlist
# entry is scoped to ONLY its generated main.js/styles.css — its data.json is
# tracked (not gitignored, unlike obsidian-local-rest-api's) and must stay
# scanned.
[extend]
useDefault = true

[allowlist]
description = "Vendored plugin bundles + known-benign local loopback proxy token"
paths = [
  '''\.obsidian/plugins/''',
  '''optional/plugins/github-sync/(main\.js|styles\.css)$''',
]
# The end-session-wiki hook captures session bash verbatim, so probes against
# the local CLIProxyAPI gateway (127.0.0.1:8317) land in sessions/*.md as
# `curl -H "Authorization: Bearer himmel-local-claudex"`. That token is a
# documented, loopback-only, shared constant checked into himmel itself
# (scripts/setup/cli-proxy-lane.ps1), not a credential. Suppress the generic
# curl-auth-header false positive for this one literal only. Anchored (^…$)
# so it suppresses ONLY the exact constant — a prefixed/suffixed bearer
# credential (himmel-local-claudex-<real-secret>) is still caught.
# Handover tokens (queue-lock release tokens, RETASK and judge nonces, git
# shas, sha256 digests) are written into bucket docs on purpose and trip
# generic-api-key on entropy, which stalls the vault autosync commit. Every
# minting site emits ONE grammar (himmel docs/internals/handover-token-grammar.md),
# allowlisted by the single anchored rule below; himmel CI runs every minting
# site against this file (test-handover-token-grammar.sh) and keeps real
# secret shapes caught. No `paths` entry for handovers/: this gitleaks build
# lets a path match alone suppress a finding, which would admit real secrets.
regexes = [
  '''^himmel-local-claudex$''',
  # handover-token grammar
  '''^(?:[a-z0-9]+(?:-[a-z0-9]+)*-pid[0-9]+|[A-Z]{1,3}-(?:[A-Za-z]{1,4}[0-9]{1,5}[A-Za-z]{0,2}|[A-Z]{2,8}-[0-9]{1,6})(?:_[a-z]{1,8})?-[0-9a-f]{4,16}|[0-9a-f]{40}|[0-9a-f]{64})[.,;:)]?$''',
  # atlassian-api-token false positive on a function name. Exact literal only.
  '''^runClaudexSharedDispatch$''',
]
