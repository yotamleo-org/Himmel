<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">A graphify star map of a 50-note sample vault</title>
<desc id="d">Each dot is a note and each line a link between two notes. Notes that link to each other a lot sit together in one coloured cluster, and each cluster is named after its map note.</desc>
