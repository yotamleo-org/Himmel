# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings (HIMMEL-926). This is the GitHub App's config --
# the App is the ONLY CodeRabbit surface himmel uses (HIMMEL-2704) -- and it
# overrides the org dashboard for this repo.
#
# Decisions (rationale on HIMMEL-926):
#   - profile chill: CodeRabbit is one finding source in a multi-critic panel;
#     the trial question is uniques, not volume — assertive nitpicks add
#     adjudication cost without answering it.
#   - request_changes_workflow off: the merge gate is a clean /pr-check
#     (CR-marker hook); a bot "request changes" state adds a second,
#     unenforced gate on a repo merged via --admin.
#   - auto_review off (HIMMEL-1252): the App reviews ONLY on an explicit
#     `@coderabbitai review` comment, not on every push — a per-push
#     auto-review would burn the shared CR rate limit on every commit,
#     including WIP ones. That comment is posted STRUCTURALLY, not left to
#     agent discretion: scripts/hooks/trigger-cr-on-pr-create.sh (HIMMEL-1362)
#     fires it automatically on every `gh pr create`, so the App is the
#     PRIMARY CodeRabbit reviewer — one review per PR, at PR-ready time — on
#     BOTH repos, with GitHub Actions off on the private repo by design
#     (HIMMEL-1305) ruling out a CI-native trigger there. Re-trigger after every
#     push: a head move discards the in-flight review. There is no local CLI
#     lane — HIMMEL-2704 retired it, so the App is the only reviewer.
#     Consequence: CodeRabbit is no longer a merge gate — it was also dropped
#     from the public repo's branch-protection required checks (it would
#     otherwise be an unsatisfiable required context with auto-review off).
#   - Jira integration deliberately NOT connected: the jira CLI owns that loop.
#   - learnings scope local (HIMMEL-6045): explicit, so the rule is visible.
#     `auto` already resolves to local on a public repo; the archived private
#     repo's rows must NOT flow back via `global` (stale, and they carry
#     propagation rules). Durable rules live in path_instructions below
#     or in scripts/cr/known-findings.json, never only in CR memory.
#     approval_delay 3: a learning is reviewable for three days before it
#     applies, so cr-learnings-refresh can prune it in that window.
language: "en-US"
knowledge_base:
  learnings:
    scope: "local"
    approval_delay: 3
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "scripts/handover/CLAUDE.md"
      - "docs/internals/ponytail-convention.md"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    # HIMMEL-1252: comment-triggered, not per-push. false = the App does not
    # auto-review on push/open; a reviewer posts `@coderabbitai review` (or
    # `@coderabbitai full review`) to run it on demand. Conserves the shared CR
    # rate limit; the App (triggered structurally on `gh pr create`) stays the
    # PRIMARY reviewer, with the /pr-check CLI lane as a second, optional pass.
    # The
    # base_branches setting below is inert while this is false (it only scopes
    # which bases get AUTO-reviewed) — kept so re-enabling needs no re-derivation.
    enabled: false
    drafts: false
    # base_branches (HIMMEL-1102): defaults to [] = ONLY the repo default
    # branch, so every STACKED PR was silently skipped -- CodeRabbit posted
    # "Review skipped: reviews are disabled for this base branch" AND a GREEN
    # "pass" check, i.e. a passing badge for a review that never ran. Stacking
    # is a routine himmel pattern (a PR based on an open PR, to avoid
    # conflicting a live session's CR loop), so this fired often and silently.
    # ADDITIVE, not a replacement -- setting this does NOT stop main from being
    # reviewed. Per the CodeRabbit docs (configuration/auto-review): "The
    # default branch is always included, and the base_branches setting extends
    # this set." So main PRs keep their auto-review regardless; this only ADDS
    # non-default bases. (A CR pass on this change raised the opposite concern
    # -- that a pattern list drops the default branch -- so the answer is
    # recorded here rather than re-litigated by the next reader.)
    #
    # ".*" = EVERY base branch, deliberately (operator: CodeRabbit on all our
    # items). An enumerated prefix list was written first and REJECTED: it is
    # the same drift trap this ticket exists to kill. That draft listed only the
    # type/slug vocabulary (feat|fix|chore|docs|refactor|test) and ALREADY
    # missed glm/ -- live on origin right now -- plus the claudex/ and
    # handover/ prefixes the offload lanes and handover system mint. A
    # hand-maintained list rots the moment a new lane appears, and its failure
    # mode is invisible: those PRs just quietly stop being reviewed. A catch-all
    # cannot drift. (This also moots the anchoring bug CR caught in that draft:
    # unanchored "fix/.*" matched hotfix/foo.)
    base_branches:
      - ".*"
  path_filters:
    - "!**/package-lock.json"
  tools:
    # On by default; listed so the choice is explicit. Off = not our stack.
    shellcheck:
      enabled: true     # reads .shellcheckrc
    gitleaks:
      enabled: true     # reads .gitleaks.toml
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    biome:
      enabled: false    # oxlint is our JS linter (pre-commit)
    eslint:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"       # shell repo; coverage % is noise
    title:
      mode: "warning"
      requirements: >-
        Conventional commit form `type(scope): [HIMMEL-n] summary`.
    issue_assessment:
      mode: "off"       # Jira not connected; the judge owns ticket coverage
    custom_checks:
      - name: "No new learning-only rule"
        mode: "warning"
        instructions: >-
          If a review comment in this PR would rest on a repository-specific
          rule that is not stated in .coderabbit.yaml path_instructions, a
          CLAUDE.md, or scripts/cr/known-findings.json, say so explicitly in
          the summary ("rule not codified: …") so it is codified instead of
          learned.
  path_instructions:
    - path: "scripts/**/*.sh"
      instructions: >-
        Shell must stay bash 3.2-compatible (macOS default): no associative
        arrays, no mapfile, no ${var,,}. Scripts run on macOS and Linux — flag
        GNU-only flags and non-portable constructs, EXCEPT in files whose header
        declares `Linux-only` (station, VM and systemd tooling), where GNU forms
        are intended. Windows/PowerShell/Git Bash/WSL portability is out of
        scope (Windows support is parked): do not raise it.
        Not GNU-only (do not flag): `find -mindepth/-maxdepth`, bare
        `mktemp -d` (macOS treats it as `-t tmp`; templates are house style,
        not a correctness bug). DO flag `\s`/`\d` inside `grep -E`/`sed -E`
        (BSD reads them as literals; use [[:space:]]/[[:digit:]]).
        Guardrail hooks are fail-closed by design; critic and
        availability wrappers are fail-open — check the file header's exit
        contract before flagging exit semantics as a bug.
    # ── Disproved-class scope narrowings (CR-learnings tuning, 2026-07-28) ──
    # Each entry narrows a rule to where it is RIGHT; none is a mute.
    - path: "scripts/**/*.sh"
      instructions: >-
        Handover-root resolution: the rule "source scripts/lib/handover-path.sh
        and call handover_root instead of hardcoding the path" applies to any
        script that reads or writes handover state at runtime, test scripts
        included. Do not flag: scripts/lib/handover-path.sh itself (it is the
        resolver and legitimately constructs "$repo_root/handovers"), a
        test-*.sh file that redirects HANDOVER_DIR (or equivalent) to a temp
        fixture before touching handover state, a test-*.sh that neither
        reads, writes, resolves nor hardcodes any handover path (do not ask it
        to add a handover bootstrap or HANDOVER_DIR redirect), hooks/guards that merely
        pattern-match the string "handovers/" in paths, or comments/prose. DO
        flag a runtime read or write of a literal ./handovers/ or
        "$repo_root/handovers" path in a script that bypasses the resolver —
        including a test-*.sh that touches a real/default handover root
        instead of a redirected fixture.
    - path: "scripts/**/*.sh"
      instructions: >-
        House style is `set -uo pipefail` WITHOUT errexit; scripts/lint/shell-lint.sh
        flags `set -e` itself as a defect, advisory (errexit leaks into sourcing
        shells). In a file whose prologue does not enable errexit, never raise
        errexit-interaction findings — claims that an `&&` list, `a && b || c`,
        or an unguarded command "aborts the script" or "silently bypasses set
        -e" have no premise, and short-circuit lists with explicit
        `|| { …; exit N; }` handling are the intended error style. Errexit
        findings are valid only in a file that itself sets -e/-o errexit, and
        only where a non-zero exit is genuinely masked with a behavioral
        consequence. Even in such a file, a failing command in a NON-FINAL
        position of an `&&` list is exempt from errexit (bash ignores it
        there; only the status of the FINAL command of the list decides), so
        do not flag it as an aborting or masked failure.
    - path: "scripts/**/*.sh"
      instructions: >-
        Bash test brackets ([ x -gt y ], [ x -eq y ]) parse operands as
        DECIMAL — leading zeros (e.g. `date +%m` yielding "08") never trigger
        octal interpretation there. Raise octal-interpretation findings only in
        arithmetic contexts ($(( )), (( )), let) where a leading-zero-capable
        operand is not already normalized via the repo's $((10#$var)) idiom.
        In those arithmetic contexts DO raise it: a validated "08"/"09" from
        date, cut or user input is an error ("value too great for base"), the
        single most common real shell finding in this repo.
    - path: "scripts/**/*.sh"
      instructions: >-
        Bare `wait` (no PID) is deliberate, in test harnesses especially: they
        spawn background stubs and assert outcomes via marker files and
        captured output, not via wait's exit status. Do not flag bare `wait`
        for discarding per-job exit codes or waiting on unintended jobs.
    - path: "scripts/**/*.sh"
      instructions: >-
        `rm -f` on a quoted single-file temp/marker/lock path — typically in a
        `trap '…' EXIT` cleanup — is the intended idempotent idiom; the target
        legitimately may not exist, and that is not a masked error. Do not flag
        it for missing existence checks or suppressed failures. Still flag:
        recursive deletion of any variable-built path that could be empty or
        unset, unquoted expansions in rm arguments, or deletion targets outside
        the script's own temp/marker files. A missing-operand `rm -f` (empty
        argument list) stays covered by this rule.
    - path: "scripts/**/*.sh"
      instructions: >-
        A line comment `# intentional: …` or `# ponytail: <ceiling>, HIMMEL-n`
        at or above the flagged line records an accepted design choice or a
        tracked limitation. Do not re-raise the same concern unless the change
        under review invalidates the stated reason; if it does, say which part.
    - path: "scripts/hooks/**"
      instructions: >-
        Guard hooks parse shell command text. Prioritize: (1) a command shape
        the guard should deny but does not (wrapper, env prefix, quoting,
        redirection, command position); (2) an over-deny of a read-only
        command. Each finding must name a concrete command string (for example
        `timeout bash scripts/cr/x.sh`). Do not raise generic "regex parsing is
        fragile" comments without one.
    - path: "scripts/**/test-*.sh"
      instructions: >-
        Flag a test that cannot fail: setup whose exit status is unchecked
        before assertions, an assertion only on presence, a stub that accepts
        any input, or a fixture under the real $HOME rather than a temp HOME.
        Each such finding should name the mutation that would still pass.
    - path: "docs/**/*.md"
      instructions: >-
        Paths like <state-repo>/handovers/…, $HANDOVER_DIR, <handover-root>/…,
        handovers/<USER_SLUG>/…, and C:/Users/<you>/… are parameterized
        references to the READER'S OWN machine or private handover state repo
        (configured via /handover-setup) — deliberately not resolvable inside
        this repository. Do not flag them as broken links or private-repo
        leaks. DO flag a literal operator-specific path (a real username in an
        absolute path) or a link to a specific private repository — those are
        genuine leaks (precedent: HIMMEL-1352 scrubbed one from fixtures).
chat:
  auto_reply: true
